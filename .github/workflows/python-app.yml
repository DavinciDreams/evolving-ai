# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest tests/test_basic.py tests/test_tools.py tests/test_web_search.py tests/test_discord_integration.py tests/test_parallel_evaluator_mock.py tests/test_persistent_storage.py -v
    - name: Test stewardship engines and migration without live services
      run: |
        pytest tests/test_runtime.py tests/test_dream_cycle.py tests/test_learning_cycle.py tests/test_improvement_lab.py tests/test_ham_memory.py tests/test_chroma_ham_migration.py tests/test_bounded_llm.py tests/test_steward_control.py tests/test_steward_learning_integration.py tests/test_evaluation_provenance.py -q
    - name: Test guarded agent with isolated SDK fixtures
      run: |
        pytest tests/test_agent_run.py tests/test_agent_review_guards.py tests/test_agent_cleanup.py tests/test_memory_safety.py -q
    - name: Test actual authenticated application with fake providers
      run: |
        pytest tests/test_steward_app_routes.py tests/test_legacy_steward_routes.py tests/test_media_service.py tests/test_connector_service.py tests/test_media_connector_routes.py -q
