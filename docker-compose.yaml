services:
  api:
    build: .
    # Container listens on PORT (default 8000)
    # Coolify: Traefik proxy routes to this automatically, no host port needed
    # Local dev: use docker-compose.override.yaml to publish ports
    expose:
      - "${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - API_AUTH_REQUIRED=${API_AUTH_REQUIRED:-true}
      - PROJECT_API_KEY=${PROJECT_API_KEY}
      # LLM Provider Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://monumentals-mac-studio.local:12345}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - ZAI_BASE_URL=${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      - ZAI_MODEL=${ZAI_MODEL:-glm-5.1}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-zai}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-glm-5.1}
      - EVALUATION_MODEL=${EVALUATION_MODEL:-glm-5.1}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - MAX_TOKENS=${MAX_TOKENS:-2048}
      - ENABLE_ENSEMBLE_JUDGE=${ENABLE_ENSEMBLE_JUDGE:-false}

      # Tool Use
      - ENABLE_TOOL_USE=${ENABLE_TOOL_USE:-true}
      - MAX_TOOL_ITERATIONS=${MAX_TOOL_ITERATIONS:-15}
      - TOOL_SANDBOX_DIR=/app
      - TPMJS_API_KEY=${TPMJS_API_KEY}
      - TPMJS_ENABLED=${TPMJS_ENABLED:-false}

      # E2B Sandbox (remote code execution)
      - E2B_API_KEY=${E2B_API_KEY}

      # Agent Scratchpad
      - SCRATCHPAD_DIR=/app/data/scratchpad

      # HAM is authoritative. Chroma remains mounted read-only for migration/rollback.
      - MEMORY_BACKEND=${MEMORY_BACKEND:-ham}
      - HAM_API_URL=${HAM_API_URL:-https://ham.flobots.xyz}
      - HAM_API_KEY=${HAM_API_KEY}
      - HAM_PROJECT=${HAM_PROJECT:-evolving-ai}
      - HAM_SCOPE=${HAM_SCOPE:-project:evolving-ai}
      - HAM_REPO=${HAM_REPO:-DavinciDreams/evolving-ai}
      - HAM_EXPECTED_AGENT_ID=${HAM_EXPECTED_AGENT_ID:-katbot-evolving-ai}
      - LEGACY_MEMORY_READ_ONLY=${LEGACY_MEMORY_READ_ONLY:-true}
      - MEMORY_PERSIST_DIRECTORY=/app/data/memory_db
      - PERSISTENT_DATA_DIR=/app/data/persistent_data
      - MEMORY_COLLECTION_NAME=${MEMORY_COLLECTION_NAME:-agent_memory}
      - MAX_MEMORY_ENTRIES=${MAX_MEMORY_ENTRIES:-10000}

      # GitHub Integration
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - GITHUB_LOCAL_REPO_PATH=/app
      - GITHUB_REPO_URL=${GITHUB_REPO_URL}
      - ENABLE_SELF_MODIFICATION=${ENABLE_SELF_MODIFICATION:-false}
      - AUTO_PR_ENABLED=${AUTO_PR_ENABLED:-false}
      - BACKUP_DIRECTORY=/app/data/backups
      - MAX_MODIFICATION_ATTEMPTS=${MAX_MODIFICATION_ATTEMPTS:-3}
      - SELF_IMPROVEMENT_MAX_FUNCTIONS=${SELF_IMPROVEMENT_MAX_FUNCTIONS:-3}
      - SELF_IMPROVEMENT_MAX_OPPORTUNITIES=${SELF_IMPROVEMENT_MAX_OPPORTUNITIES:-5}
      - REQUIRE_VALIDATION=${REQUIRE_VALIDATION:-true}

      # Knowledge Base Configuration
      - KNOWLEDGE_BASE_PATH=/app/data/knowledge_base
      - AUTO_UPDATE_KNOWLEDGE=${AUTO_UPDATE_KNOWLEDGE:-false}
      - KNOWLEDGE_SIMILARITY_THRESHOLD=${KNOWLEDGE_SIMILARITY_THRESHOLD:-0.8}

      # Discord Integration
      - DISCORD_ENABLED=${DISCORD_ENABLED:-false}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CHANNEL_IDS=${DISCORD_CHANNEL_IDS}
      - DISCORD_STATUS_CHANNEL_ID=${DISCORD_STATUS_CHANNEL_ID}
      - DISCORD_MENTION_REQUIRED=${DISCORD_MENTION_REQUIRED:-false}
      - DISCORD_MAX_MESSAGE_LENGTH=${DISCORD_MAX_MESSAGE_LENGTH:-2000}
      - DISCORD_ATTACHMENT_THRESHOLD=${DISCORD_ATTACHMENT_THRESHOLD:-12000}
      - DISCORD_MAX_ATTACHMENT_BYTES=${DISCORD_MAX_ATTACHMENT_BYTES:-7500000}
      - DISCORD_TYPING_INDICATOR=${DISCORD_TYPING_INDICATOR:-true}
      - DISCORD_EMBED_RESPONSES=${DISCORD_EMBED_RESPONSES:-true}
      - DISCORD_COMMAND_PREFIX=${DISCORD_COMMAND_PREFIX}
      - DISCORD_RATE_LIMIT_MESSAGES=${DISCORD_RATE_LIMIT_MESSAGES:-10}
      - DISCORD_COOLDOWN_SECONDS=${DISCORD_COOLDOWN_SECONDS:-2}
      - DISCORD_STATUS_UPDATES_ENABLED=${DISCORD_STATUS_UPDATES_ENABLED:-true}
      - DISCORD_STATUS_ON_IMPROVEMENT=${DISCORD_STATUS_ON_IMPROVEMENT:-true}
      - DISCORD_STATUS_ON_KNOWLEDGE_UPDATE=${DISCORD_STATUS_ON_KNOWLEDGE_UPDATE:-true}
      - DISCORD_STATUS_ON_HIGH_QUALITY=${DISCORD_STATUS_ON_HIGH_QUALITY:-false}

      # Web Search
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_DEFAULT_PROVIDER=${WEB_SEARCH_DEFAULT_PROVIDER:-duckduckgo}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-5}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SERPAPI_KEY=${SERPAPI_KEY}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/agent.log

      # Evaluation
      - ENABLE_EVALUATION=${ENABLE_EVALUATION:-false}

      # Opt-in bounded stewardship and media (single worker only)
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - CHAT_TIMEOUT_SECONDS=${CHAT_TIMEOUT_SECONDS:-60}
      - EVALUATION_TIMEOUT_SECONDS=${EVALUATION_TIMEOUT_SECONDS:-8}
      - ENABLE_HOST_TOOLS=${ENABLE_HOST_TOOLS:-false}
      - ENABLE_BEST_OF_N=${ENABLE_BEST_OF_N:-false}
      - ITERATIVE_REVISION_MAX_ROUNDS=${ITERATIVE_REVISION_MAX_ROUNDS:-1}
      - DREAM_CYCLE_ENABLED=${DREAM_CYCLE_ENABLED:-false}
      - DREAM_CYCLE_INTERVAL_SECONDS=${DREAM_CYCLE_INTERVAL_SECONDS:-900}
      - DREAM_CYCLE_IDLE_SECONDS=${DREAM_CYCLE_IDLE_SECONDS:-60}
      - IMPROVEMENT_LAB_ENABLED=${IMPROVEMENT_LAB_ENABLED:-false}
      - IMPROVEMENT_STATE_MEMORY_ID=${IMPROVEMENT_STATE_MEMORY_ID:-}
      - LEARNING_CYCLE_ENABLED=${LEARNING_CYCLE_ENABLED:-false}
      - LEARNING_CYCLE_SUITE_FILE=${LEARNING_CYCLE_SUITE_FILE:-}
      - LEARNING_CYCLE_AUTO_PROMOTE=${LEARNING_CYCLE_AUTO_PROMOTE:-false}
      - MEDIA_OPENAI_API_KEY=${MEDIA_OPENAI_API_KEY:-}
      - MEDIA_VISION_ENABLED=${MEDIA_VISION_ENABLED:-false}
      - MEDIA_TRANSCRIPTION_ENABLED=${MEDIA_TRANSCRIPTION_ENABLED:-false}
      - MEDIA_SPEECH_ENABLED=${MEDIA_SPEECH_ENABLED:-false}
      - CONNECTORS_ENABLED=${CONNECTORS_ENABLED:-false}
      - CONNECTOR_ALLOWLIST=${CONNECTOR_ALLOWLIST:-app-webhook}
      - CONNECTOR_WEBHOOK_SECRET=${CONNECTOR_WEBHOOK_SECRET:-}

    volumes:
      # Persistent data — survives redeployments
      # Coolify: deploy as "Docker Compose" to auto-detect these
      - type: volume
        source: memory-data
        target: /app/data/memory_db
        read_only: true
      - type: volume
        source: knowledge-data
        target: /app/data/knowledge_base
      - type: volume
        source: backup-data
        target: /app/data/backups
      - type: volume
        source: persistent-data
        target: /app/data/persistent_data
      - type: volume
        source: scratchpad-data
        target: /app/data/scratchpad
      - type: volume
        source: app-logs
        target: /app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  memory-data:
    name: evolving-ai-memory
  knowledge-data:
    name: evolving-ai-knowledge
  backup-data:
    name: evolving-ai-backups
  persistent-data:
    name: evolving-ai-persistent
  scratchpad-data:
    name: evolving-ai-scratchpad
  app-logs:
    name: evolving-ai-logs
